<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flaminio Menu</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .box {
      background: white;
      padding: 40px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      max-width: 400px;
      width: 85%;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #777;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>🍽️ فلامينيو</h1>
    <p>المنيو قريبًا...</p>
  </div>
</body>
</html>
